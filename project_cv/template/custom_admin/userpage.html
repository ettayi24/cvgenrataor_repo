<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CVs - Professional Panel</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts for Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
        }
        .main-container {
            background-color: #FFFFFF;
            border-radius: 1rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
        }
        .cv-card {
            border: 1px solid #E9ECEF;
            border-left: 4px solid #0056B3; /* Deep professional blue */
            border-radius: 0.75rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.04);
        }
        .cv-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.08);
        }
        .btn-action {
            border-radius: 50px;
            padding: 0.5rem 1rem;
            transition: transform 0.2s ease;
        }
        .btn-action:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="main-container">
            <!-- Header Section -->
            <div class="d-flex justify-content-between align-items-center mb-5 pb-4 border-bottom">
                <h2 class="h3 mb-0 fw-bold text-dark">My CVs</h2>
                <a href="{% url 'templates' %}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-plus-lg me-2"></i> Create New CV
                </a>
            </div>
            <!-- CV List -->
            <div class="row g-4">
                {% if cvs %}
                    {% for cv in cvs %}
                        <div class="col-12">
                            <div class="cv-card p-4 d-flex flex-column flex-md-row align-items-md-center justify-content-between">
                                <div>
                                    <h5 class="fw-semibold mb-1">{{ cv.CV_Name }}</h5>
                                    <p class="text-muted mb-0"><small>Created on: {{ cv.Created_at|date:"M d, Y" }}</small></p>
                                </div>
                                <div class="mt-3 mt-md-0 d-flex align-items-center">
                                    <a href="#" class="btn btn-outline-info btn-action me-2">
                                        <i class="bi bi-eye"></i> <span class="d-none d-md-inline ms-1">View</span>
                                    </a>
                                    <a href="{{ cv.CV_File.url }}" class="btn btn-outline-primary btn-action me-2">
    <i class="bi bi-download"></i> Download
</a>

                                    <a href="#" class="btn btn-outline-danger btn-action">
                                        <i class="bi bi-trash"></i> <span class="d-none d-md-inline ms-1">Delete</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                {% else %}
                    <!-- No CVs State -->
                    <div class="col-12 d-flex justify-content-center">
                        <div class="text-center py-5">
                            <i class="bi bi-file-earmark-plus text-secondary display-1"></i>
                            <p class="mt-3 text-muted">You haven't created any CVs yet.</p>
                        </div>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
